<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Feliz Dia das Mães</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <canvas id="bg-canvas"></canvas>

  <section id="hero">

    <div class="hero-content">
      <div class="badge">
        Feliz dia das mães
      </div>

      <h1 class="hero-title">
        Para a mais <span>linda</span><br>
        do mundo inteiro
      </h1>

      <p class="hero-subtitle">
        Um pequeno jogo feito com todo meu amor
      </p>

      <a href="#game-section" class="btn-primary">
        Começar
      </a>
    </div>

  </section>

  <section id="game-section">

    <div class="game-header">
      <h2>Jogos especiais para você</h2>
    </div>
    <div class="tabs">

      <button class="tab-btn active" id="tab-memory" onclick="switchTab('memory')">
        Memória
      </button>

      <button class="tab-btn" id="tab-word" onclick="switchTab('word')">
        Palavras
      </button>
    </div>

    <!-- memória -->
    <div class="game-panel active" id="panel-memory">
      <div id="memory-grid" class="memory-grid"></div>
      <div id="mem-status"></div>
    </div>

    <!-- palavras -->
    <div class="game-panel" id="panel-word">
      <div class="word-card">
        <div id="word-cat"></div>

        <h3 id="word-clue"></h3>

        <div id="word-blanks"></div>
        <div id="letter-choices"></div>

        <p id="word-feedback"></p>

        <button id="word-next-btn" onclick="nextWord()">
          Próxima palavra
        </button>

      </div>
    </div>
    <!-- presentes -->
    <div class="gifts-section">

      <h2>Caixinhas especiais</h2>

      <div id="gifts-row" class="gifts-row"></div>
    </div>

  </section>

  <!-- modal -->
  <div id="overlay" onclick="closeGiftMsg()"></div>
  <div class="gift-msg" id="gift-msg">
    <div id="gift-msg-icon"></div>

    <h2 id="gift-msg-title"></h2>

    <p id="gift-msg-text"></p>

    <button onclick="closeGiftMsg()">
      Fechar
    </button>

  </div>

  <!-- vitória -->
  <div id="win-overlay">
    <div class="win-box">

      <h2>Parabéns!</h2>

      <p id="win-msg"></p>

      <button onclick="closeWin()">
        Fechar
      </button>

    </div>
  </div>

  <div id="toast"></div>

  <script src="js/script.js"></script>

</body>

</html>
