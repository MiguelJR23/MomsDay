<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz dia das mães</title>
  <meta name="description" content="A beautiful Mother's Day celebration game created with love, just for you Mom." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <section id="hero">
    <div class="hero-glow"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow"></div>

    <div class="hero-content">
      <div class="badge">💐 Feliz dia das mães 💐</div>

      <h1 class="hero-title">
        Para a mais <span>linda</span><br />
        do mundo inteiro
      </h1>

      <p class="hero-subtitle">
        Um pequeno jogo feito com todo meu amor ❤️
      </p>

      <p class="hero-desc">
        Mãe, este é um pequeno presente só para você jogos, flores e palavras
        que nunca poderão expressar completamente o quanto você significa para mim.
      </p>

      <a href="#game-section" class="btn-primary">
        Comece seu dia especial 🌸
      </a>
    </div>

    <div class="scroll-arrow">
      <span>↓</span>
    </div>
  </section>
  <script src="js/script.js"></script>
</body>

</html>
