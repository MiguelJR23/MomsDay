<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Mother's Day 💖 A Special Gift For You</title>
  <meta name="description" content="A beautiful Mother's Day celebration game created with love, just for you Mom." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section id="hero">
    <div class="hero-glow"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow"></div>

    <div class="hero-content">
      <div class="badge">💐 Happy Mother's Day 💐</div>

      <h1 class="hero-title">
        To The Most <span>Beautiful</span><br />
        Woman In The World
      </h1>

      <p class="hero-subtitle">
        A Little Game Made With All My Love ❤️
      </p>

      <p class="hero-desc">
        Mom, this is a small gift just for you — games, flowers, & words
        that can never fully express how much you mean to me.
      </p>

      <a href="#game-section" class="btn-primary">
        Start Your Special Day 🌸
      </a>
    </div>

    <div class="scroll-arrow">
      <span>↓</span>
    </div>
  </section>
  <script src="script.js"></script>
</body>

</html>
